<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" sizes="64x64" href="/static/favicon-64.png">
<link rel="icon" type="image/png" sizes="256x256" href="/static/favicon.png">
<link rel="apple-touch-icon" href="/static/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShotBox — вход</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:radial-gradient(1200px 600px at 50% -10%,#1b2233,#0f1115 60%);
       color:#e8eaed;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:20px}
  .card{width:100%;max-width:380px;background:#171a21;border:1px solid #262b36;border-radius:18px;
        padding:32px 28px;box-shadow:0 20px 60px rgba(0,0,0,.55)}
  .logo{font-size:26px;font-weight:700;text-align:center;margin-bottom:6px}
  .logo span{background:linear-gradient(90deg,#4f8cff,#7c5cff);
             -webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .sub{text-align:center;color:#9aa3b2;font-size:13px;margin-bottom:24px}
  label{display:block;font-size:12.5px;color:#9aa3b2;margin:14px 0 6px}
  input{width:100%;background:#1e222b;border:1px solid #262b36;color:#e8eaed;border-radius:10px;
        padding:11px 14px;font-size:14.5px;outline:none;font-family:inherit}
  input:focus{border-color:#4f8cff}
  button{width:100%;margin-top:22px;background:linear-gradient(135deg,#4f8cff,#7c5cff);border:0;
         color:#fff;padding:12px;border-radius:11px;font-weight:600;font-size:15px;cursor:pointer}
  button:active{transform:translateY(1px)}
  .err{margin-top:16px;background:#3a1720;border:1px solid #6a2a33;color:#ff9daa;
       padding:10px 12px;border-radius:9px;font-size:13px;text-align:center}
  .foot{margin-top:20px;text-align:center;color:#5b6473;font-size:11.5px}
</style>
</head>
<body>
<form class="card" method="post" action="/login">
  <div class="logo">📸 <span>ShotBox</span></div>
  <div class="sub">Моя галерея скриншотов</div>

  <label>Логин</label>
  <input type="text" name="username" value="admin" autocomplete="username" required autofocus>

  <label>Пароль</label>
  <input type="password" name="password" autocomplete="current-password" required>

  <button type="submit">Войти</button>

  <!--ERROR-->

  <div class="foot">Доступ только для владельца</div>
</form>
</body>
</html>
