<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShotBox — мои скриншоты</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --card2:#1e222b; --line:#262b36;
    --text:#e8eaed; --muted:#9aa3b2; --accent:#4f8cff; --accent2:#7c5cff;
    --ok:#2ecc71; --warn:#f5a623;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.92);
         backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 20px}
  .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  h1{margin:0;font-size:19px;letter-spacing:.3px}
  h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2));
          -webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .stat{color:var(--muted);font-size:13px}
  input[type=search]{flex:1;min-width:180px;background:var(--card);border:1px solid var(--line);
    color:var(--text);border-radius:10px;padding:9px 14px;font-size:14px;outline:none}
  input[type=search]:focus{border-color:var(--accent)}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .tab{background:var(--card);border:1px solid var(--line);color:var(--muted);
       padding:7px 14px;border-radius:999px;cursor:pointer;font-size:13.5px;
       transition:.15s;user-select:none}
  .tab:hover{border-color:#3a4356;color:var(--text)}
  .tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
              border-color:transparent;color:#fff;font-weight:600}
  .tab .n{opacity:.75;font-size:12px;margin-left:4px}
  .progress-wrap{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:10px 14px;margin:12px 20px 0;display:flex;align-items:center;gap:12px;font-size:13px}
  .progress-wrap.hide{display:none}
  .progress-bar{flex:1;height:6px;background:#222733;border-radius:999px;overflow:hidden;min-width:80px}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));
    width:0;transition:width .6s ease;border-radius:999px}
  .pinfo{color:var(--muted);white-space:nowrap}
  .spinner{width:13px;height:13px;border:2px solid #2b3240;border-top-color:var(--accent);
    border-radius:50%;animation:spin 1s linear infinite;display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}
  .fmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11.5px;margin-top:2px}
  .imdb{color:#ffcc4d;font-weight:700}
  .st{padding:1px 7px;border-radius:999px;font-size:10.5px;border:1px solid}
  .st-released{color:#7ee0b8;border-color:#1c4a3a;background:#0d221c}
  .st-ongoing{color:#8fd0ff;border-color:#1c324a;background:#0d1a22}
  .st-upcoming{color:#ffd479;border-color:#4a3c1c;background:#221c0d}
  .st-unknown{color:var(--muted);border-color:var(--line);background:var(--card2)}
  main{padding:20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        overflow:hidden;cursor:pointer;transition:.18s;display:flex;flex-direction:column}
  .card:hover{transform:translateY(-3px);border-color:#3a4356;
              box-shadow:0 10px 26px rgba(0,0,0,.45)}
  .thumb{width:100%;aspect-ratio:9/16;object-fit:cover;background:#0a0c10;display:block}
  .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:5px;flex:1}
  .title{font-weight:600;font-size:13.5px;line-height:1.35;
         display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .txt{color:var(--muted);font-size:12px;line-height:1.35;
       display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .meta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;
        color:#6b7484;font-size:11px;padding-top:6px}
  .badge{font-size:10.5px;padding:2px 8px;border-radius:999px;background:var(--card2);
         color:var(--muted);border:1px solid var(--line)}
  .badge.film{color:#ffd479;border-color:#4a3c1c;background:#221c0d}
  .badge.serial{color:#8fd0ff;border-color:#1c324a;background:#0d1a22}
  .badge.design{color:#c6a8ff;border-color:#35264a;background:#1a1226}
  .badge.olx{color:#7ee0b8;border-color:#1c4a3a;background:#0d221c}
  .badge.phrase{color:#ff9ec4;border-color:#4a1c30;background:#220d17}
  .badge.useful{color:#9ee37d;border-color:#2c4a1c;background:#152208}
  .badge.business{color:#ffc48f;border-color:#4a3520;background:#221a0d}
  .badge.books{color:#a9c8ff;border-color:#22354a;background:#0d1622}
  .badge.med{color:#ff9e9e;border-color:#4a2020;background:#220d0d}
  .badge.visa{color:#ffd0a8;border-color:#4a3a1c;background:#221a0d}
  .badge.travel{color:#8fe3ff;border-color:#1c3a4a;background:#0d1d22}
  .badge.work{color:#c8b8ff;border-color:#33264a;background:#161226}
  .badge.cartoon{color:#ffb3e6;border-color:#4a1c3a;background:#220d1a}
  .badge.docs{color:#d6d6d6;border-color:#3a3a3a;background:#1a1a1a}
  .badge.psy{color:#c9a8ff;border-color:#3a2a4a;background:#1c1226}
  /* таблица фильмов */
  .films-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:12px}
  .films-head h2{margin:0;font-size:17px}
  .films-head label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer}
  .ftable{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);
          border-radius:12px;overflow:hidden;font-size:13px;margin-bottom:22px}
  .ftable th{position:sticky;top:0;background:var(--card2);text-align:left;padding:10px 12px;
             color:var(--muted);font-weight:600;font-size:12px;border-bottom:1px solid var(--line);
             cursor:pointer;white-space:nowrap;user-select:none}
  .ftable th:hover{color:var(--text)}
  .ftable td{padding:9px 12px;border-bottom:1px solid #1c2029;vertical-align:top}
  .ftable tr:last-child td{border-bottom:0}
  .ftable tr:hover td{background:#1a1e26}
  .ftable .fname{font-weight:600;cursor:pointer;min-width:150px}
  .ftable .fname:hover{color:var(--accent)}
  .ftable .fdesc{color:var(--muted);font-size:12px;max-width:340px;line-height:1.4}
  .ftable .fr{color:#ffcc4d;font-weight:700;white-space:nowrap}
  .ftable .fyear{color:var(--muted);white-space:nowrap}
  .ftable .fgenre{color:#9aa3b2;font-size:12px;max-width:130px}
  .ftable .fwatch{text-align:center}
  .ftable input[type=checkbox]{width:18px;height:18px;accent-color:#2ecc71;cursor:pointer}
  .ftable tr.watched td{opacity:.45}
  #posterPop{position:fixed;z-index:80;display:none;pointer-events:none;
    border-radius:10px;overflow:hidden;box-shadow:0 12px 34px rgba(0,0,0,.7);
    border:1px solid #333c4d;background:#000}
  #posterPop img{display:block;width:180px;height:auto}
  .fname{position:relative}
  .scans-title{font-size:15px;margin:0 0 12px}
  .empty{color:var(--muted);text-align:center;padding:60px 20px}
  /* modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;
         align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal.open{display:flex}
  .sheet{background:var(--card);border:1px solid var(--line);border-radius:16px;
         max-width:1000px;width:100%;max-height:92vh;overflow:auto;display:flex;flex-wrap:wrap}
  .sheet .imgwrap{flex:1 1 380px;background:#000;display:flex;align-items:center;justify-content:center}
  .sheet img{max-width:100%;max-height:88vh;object-fit:contain}
  .sheet .side{flex:1 1 320px;padding:20px;display:flex;flex-direction:column;gap:12px}
  .sheet h3{margin:0;font-size:17px}
  label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
  textarea,select,input[type=text]{width:100%;background:var(--card2);border:1px solid var(--line);
    color:var(--text);border-radius:9px;padding:9px 11px;font-size:13.5px;outline:none;font-family:inherit}
  textarea:focus,select:focus,input:focus{border-color:var(--accent)}
  .stars{display:flex;gap:4px;font-size:22px;cursor:pointer}
  .star{color:#3a4150}.star.on{color:#ffcc4d}
  .row{display:flex;gap:10px}
  .btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#fff;
       padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:600;font-size:13.5px}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
  .close{position:absolute;top:14px;right:18px;background:rgba(0,0,0,.6);border:0;color:#fff;
         font-size:22px;width:38px;height:38px;border-radius:50%;cursor:pointer}
  .link{color:var(--accent);font-size:12.5px;text-decoration:none}
  @media(max-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
    .thumb{aspect-ratio:9/14} main{padding:12px}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>📸 <span>ShotBox</span></h1>
    <div class="stat" id="stat">загрузка…</div>
    <input type="search" id="q" placeholder="Поиск: название фильма, фраза, приложение…">
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<div class="progress-wrap" id="progressWrap">
  <span class="spinner" id="pSpin"></span>
  <span class="pinfo" id="pText">Анализ скриншотов…</span>
  <div class="progress-bar"><div class="progress-fill" id="pFill"></div></div>
  <span class="pinfo" id="pPct">0%</span>
  <span class="pinfo" id="pEta"></span>
</div>
<main>
  <section id="filmsSection" style="display:none">
    <div class="films-head">
      <h2 id="filmsCount">🎬 Фильмы и сериалы</h2>
      <label><input type="checkbox" id="hideWatched"> скрыть просмотренные</label>
    </div>
    <table class="ftable">
      <thead><tr>
        <th data-sort="title">Название</th>
        <th data-sort="category">Тип</th>
        <th data-sort="imdb">★ IMDb</th>
        <th data-sort="kp_rating">КП</th>
        <th data-sort="year">Год</th>
        <th data-sort="genre">Жанр</th>
        <th>Описание</th>
        <th data-sort="watched">Смотрел</th>
      </tr></thead>
      <tbody id="filmsBody"></tbody>
    </table>
    <div class="empty" id="filmsEmpty" style="display:none">Пока нет распознанных фильмов</div>
    <h3 class="scans-title">Скрины</h3>
  </section>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">Ничего не найдено</div>
</main>

<div id="posterPop"><img id="posterPopImg" src="" alt=""></div>

<div class="modal" id="modal">
  <div class="sheet" style="position:relative">
    <button class="close" onclick="closeModal()">×</button>
    <div class="imgwrap"><img id="mImg" src=""></div>
    <div class="side">
      <h3 id="mTitle">—</h3>
      <div class="stat" id="mMeta"></div>
      <div id="mFilm" style="display:none"></div>
      <div>
        <label>Категория</label>
        <select id="mCat">
          <option value="фильм">🎬 Фильм</option>
          <option value="сериал">📺 Сериал</option>
          <option value="дизайн">🎨 Дизайн</option>
          <option value="олх">🛒 OLX</option>
          <option value="бизнес">💼 Бизнес</option>
          <option value="книги">📚 Книги</option>
          <option value="психология">🧠 Психология</option>
          <option value="медицина">🏥 Медицина</option>
          <option value="визы">🛂 Визы и переезд</option>
          <option value="путешествия">✈️ Путешествия</option>
          <option value="работа">💼 Работа</option>
          <option value="документы">📄 Документы</option>
          <option value="мультфильм">🧸 Мультфильм</option>
          <option value="фраза">💬 Фраза</option>
          <option value="полезность">🛠 Полезность</option>
          <option value="другое">📦 Прочее</option>
        </select>
      </div>
      <div>
        <label>Название / заголовок</label>
        <input type="text" id="mName" placeholder="Например: Дюна: Пророчество">
      </div>
      <div>
        <label>Текст / описание</label>
        <textarea id="mText" rows="4"></textarea>
      </div>
      <div>
        <label>Мой отзыв</label>
        <textarea id="mReview" rows="3" placeholder="Что понравилось, стоит ли смотреть…"></textarea>
      </div>
      <div>
        <label>Оценка</label>
        <div class="stars" id="mStars">
          <span class="star" data-v="1">★</span><span class="star" data-v="2">★</span>
          <span class="star" data-v="3">★</span><span class="star" data-v="4">★</span>
          <span class="star" data-v="5">★</span>
        </div>
      </div>
      <div class="row">
        <button class="btn" onclick="saveItem()">Сохранить</button>
        <a class="link" id="mOrig" target="_blank" style="align-self:center">Открыть оригинал ↗</a>
      </div>
    </div>
  </div>
</div>

<script>
const CATS = [
  ["all","Всё"],["фильм","🎬 Фильмы"],["дизайн","🎨 Дизайн"],["олх","🛒 OLX"],
  ["бизнес","💼 Бизнес"],["книги","📚 Книги"],["психология","🧠 Психология"],["медицина","🏥 Медицина"],
  ["визы","🛂 Визы и переезд"],["путешествия","✈️ Путешествия"],["работа","💼 Работа"],
  ["документы","📄 Документы"],["фраза","💬 Фразы"],["полезность","🛠 Полезности"],
  ["другое","📦 Прочее"]
];
const BADGE = {фильм:"film", сериал:"serial", дизайн:"design", олх:"olx", фраза:"phrase", полезность:"useful", бизнес:"business", книги:"books", психология:"psy", медицина:"med", визы:"visa", путешествия:"travel", работа:"work", мультфильм:"cartoon", документы:"docs"};
const ST_LABEL = {released:"Вышел", ongoing:"Идёт", upcoming:"Скоро", unknown:""};
let cat = "all", query = "", current = null, rating = 0;
// поддержка прямых ссылок: #фильм, #олх и т.д.
(function(){
  const h = decodeURIComponent(location.hash.slice(1));
  if(h && CATS.some(([k])=>k===h)) cat = h;
})();

function stBadge(st){
  if(!st || !ST_LABEL[st]) return "";
  return `<span class="st st-${st}">${ST_LABEL[st]}</span>`;
}
function filmMeta(it){
  if(!["фильм","сериал","мультфильм"].includes(it.category)) return "";
  const parts = [];
  if(it.imdb) parts.push(`<span class="imdb">★ ${it.imdb}</span>`);
  if(it.year) parts.push(`<span>${it.year}</span>`);
  const st = stBadge(it.status);
  if(st) parts.push(st);
  return parts.length ? `<div class="fmeta">${parts.join("")}</div>` : "";
}

async function loadProgress(){
  try{
    const p = await (await fetch("/api/progress")).json();
    const wrap = document.getElementById("progressWrap");
    if(p.percent >= 100){ wrap.classList.add("hide"); return; }
    wrap.classList.remove("hide");
    document.getElementById("pFill").style.width = p.percent + "%";
    document.getElementById("pPct").textContent = p.percent + "%";
    document.getElementById("pText").textContent =
      `Анализ: ${p.analyzed} из ${p.total}`;
    document.getElementById("pEta").textContent =
      p.eta_min > 0 ? `осталось ~${p.eta_min} мин` : "завершается…";
  }catch(e){}
}
setInterval(loadProgress, 15000);

let filmsData = [], filmsSort = {key:"imdb", dir:-1};

function typeBadge(it){
  const map = { "фильм":["🎬 Фильм","film"], "сериал":["📺 Сериал","serial"],
                "мультфильм":["🧸 Мультик","cartoon"] };
  const [label, cls] = map[it.category] || ["🎬 Фильм","film"];
  return `<span class="badge ${cls}" style="white-space:nowrap">${label}</span>`;
}

function stText(it){
  const st = {released:"Вышел", ongoing:"Идёт", upcoming:"Скоро"}[it.status] || "";
  return st;
}

async function loadFilmsTable(){
  const d = await (await fetch("/api/films")).json();
  filmsData = d.items || [];
  renderFilmsTable();
}

function renderFilmsTable(){
  const hideW = document.getElementById("hideWatched").checked;
  let items = filmsData.filter(i => !hideW || !i.watched);
  const {key, dir} = filmsSort;
  items = items.slice().sort((a,b)=>{
    let x = a[key], y = b[key];
    if(key==="title"||key==="genre"||key==="category"){ x=(x||"").toLowerCase(); y=(y||"").toLowerCase(); return x>y?dir:x<y?-dir:0; }
    x = (x===null||x===undefined) ? (dir>0?-1:99999) : Number(x);
    y = (y===null||y===undefined) ? (dir>0?-1:99999) : Number(y);
    return (x-y)*dir;
  });
  document.getElementById("filmsCount").textContent =
    `🎬 Фильмы и сериалы (${items.length})`;
  document.getElementById("filmsEmpty").style.display = items.length ? "none" : "block";
  document.getElementById("filmsBody").innerHTML = items.map(it=>{
    const st = stText(it);
    const desc = (it.text||"").replace(/\s+/g," ").trim();
    return `<tr class="${it.watched?'watched':''}">
      <td class="fname" data-pid="${it.poster||''}" onclick='openById(${it.id})'>${esc(it.title||"Без названия")}
        ${st?`<span class="st st-${it.status}">${st}</span>`:""}</td>
      <td>${typeBadge(it)}</td>
      <td class="fr">${it.imdb?("★ "+it.imdb):"—"}</td>
      <td class="fr" style="color:#ff9e4a">${it.kp_rating?it.kp_rating:"—"}</td>
      <td class="fyear">${it.year||"—"}</td>
      <td class="fgenre">${esc(it.genre||"—")}</td>
      <td class="fdesc">${esc(desc.slice(0,160))}${desc.length>160?"…":""}</td>
      <td class="fwatch"><input type="checkbox" ${it.watched?"checked":""}
          onchange="toggleWatched(${it.id}, this.checked)"></td>
    </tr>`;
  }).join("");
}

// превью постера при наведении
(function(){
  const pop = document.getElementById("posterPop");
  const img = document.getElementById("posterPopImg");
  document.addEventListener("mouseover", e=>{
    const cell = e.target.closest(".fname");
    if(!cell) return;
    const id = cell.dataset.pid;
    if(!id) return;
    img.src = "/posters/" + id;
    pop.style.display = "block";
    const r = cell.getBoundingClientRect();
    let left = r.right + 14, top = r.top - 30;
    if(left + 190 > window.innerWidth) left = r.left - 194;
    if(top + 280 > window.innerHeight) top = window.innerHeight - 290;
    if(top < 8) top = 8;
    pop.style.left = left + "px";
    pop.style.top = top + "px";
  });
  document.addEventListener("mouseout", e=>{
    if(e.target.closest(".fname")) pop.style.display = "none";
  });
  window.addEventListener("scroll", ()=>{ pop.style.display = "none"; }, {passive:true});
})();

async function toggleWatched(id, val){
  await fetch("/api/items/"+id,{method:"POST",headers:{"Content-Type":"application/json"},
    body: JSON.stringify({watched: val?1:0})});
  const it = filmsData.find(x=>x.id===id);
  if(it) it.watched = val?1:0;
  renderFilmsTable();
}

async function openById(id){
  const it = filmsData.find(x=>x.id===id);
  if(!it) return;
  const full = await (await fetch("/api/items?q=&limit=500")).json();
  const found = full.items.find(x=>x.id===id) || it;
  openItem(found);
}

document.addEventListener("click", e=>{
  const th = e.target.closest(".ftable th[data-sort]");
  if(!th) return;
  const k = th.dataset.sort;
  filmsSort = {key:k, dir: (filmsSort.key===k ? -filmsSort.dir : -1)};
  renderFilmsTable();
});
document.addEventListener("change", e=>{
  if(e.target.id==="hideWatched") renderFilmsTable();
});

async function loadStats(){
  const s = await (await fetch("/api/stats")).json();
  document.getElementById("stat").textContent =
    `${s.total} скриншотов · распознано ${s.analyzed}`;
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = CATS.map(([k,label])=>{
    const known = CATS.filter(([c])=>c!=="all"&&c!=="другое")
                      .reduce((a,[c])=>a+(s.categories[c]||0),0);
    const n = k==="all" ? s.total : (k==="другое" ? Math.max(s.total-known,0) : (s.categories[k]||0));
    return `<div class="tab ${k===cat?'active':''}" data-k="${k}">${label}<span class="n">${n}</span></div>`;
  }).join("");
  tabs.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
    cat=t.dataset.k; history.replaceState(null,"","#"+encodeURIComponent(cat)); loadStats(); load();
    const fs = document.getElementById("filmsSection");
    if(cat==="фильм"){ fs.style.display="block"; loadFilmsTable(); }
    else fs.style.display="none";
  });
}

async function load(){
  const r = await (await fetch(`/api/items?category=${encodeURIComponent(cat)}&q=${encodeURIComponent(query)}`)).json();
  const grid = document.getElementById("grid");
  document.getElementById("empty").style.display = r.items.length ? "none" : "block";
  grid.innerHTML = r.items.map(it=>{
    const b = BADGE[it.category] || "";
    const title = it.title || it.app || "Без названия";
    const txt = it.text || it.review || "";
    const d = (it.shot_date||"").slice(0,10);
    return `<div class="card" onclick='openItem(${JSON.stringify(it).replace(/'/g,"&#39;")})'>
      <img class="thumb" loading="lazy" src="/thumbs/${it.thumb}" alt="">
      <div class="body">
        <div class="title">${esc(title)}</div>
        ${txt?`<div class="txt">${esc(txt)}</div>`:""}
        ${filmMeta(it)}
        <div class="meta"><span>${esc(it.app||"")}${it.dup_count>1?` <span class="badge">×${it.dup_count}</span>`:""}</span><span>${d}</span></div>
        ${b?`<span class="badge ${b}">${esc(it.category)}</span>`:""}
      </div></div>`;
  }).join("");
}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function openItem(it){
  current = it; rating = it.rating||0;
  document.getElementById("mImg").src = "/photos/" + it.rel_path;
  document.getElementById("mTitle").textContent = it.title || it.app || "—";
  document.getElementById("mMeta").textContent =
    `${it.app||""} · ${it.shot_date||""}`;
  document.getElementById("mCat").value = it.category==="не разобрано" ? "другое" : it.category;
  document.getElementById("mName").value = it.title||"";
  document.getElementById("mText").value = it.text||"";
  document.getElementById("mReview").value = it.review||"";
  document.getElementById("mOrig").href = "/photos/" + it.rel_path;

  const mf = document.getElementById("mFilm");
  if(["фильм","сериал","мультфильм"].includes(it.category)){
    const bits = [];
    if(it.imdb) bits.push(`<span class="imdb">★ ${it.imdb} IMDb</span>`);
    if(it.kp_rating) bits.push(`<span style="color:#ff9e4a;font-weight:700">КП ${it.kp_rating}</span>`);
    if(it.year) bits.push(`<span>${it.year}</span>`);
    if(it.genre) bits.push(`<span style="color:var(--muted)">${esc(it.genre)}</span>`);
    const st = stBadge(it.status);
    if(st) bits.push(st);
    const q = encodeURIComponent(it.title || it.text || "");
    bits.push(`<a class="link" target="_blank" href="https://www.kinopoisk.ru/index.php?kp_query=${q}">Кинопоиск ↗</a>`);
    mf.innerHTML = `<div class="fmeta">${bits.join("")}</div>`;
    mf.style.display = "block";
  } else {
    mf.style.display = "none";
  }

  paintStars();
  document.getElementById("modal").classList.add("open");
}
function paintStars(){
  document.querySelectorAll("#mStars .star").forEach(s=>{
    s.classList.toggle("on", +s.dataset.v <= rating);
  });
}
document.getElementById("mStars").onclick = e=>{
  if(e.target.dataset.v){ rating = +e.target.dataset.v; paintStars(); }
};
function closeModal(){document.getElementById("modal").classList.remove("open");}
document.getElementById("modal").onclick = e=>{ if(e.target.id==="modal") closeModal(); };

async function saveItem(){
  if(!current) return;
  await fetch("/api/items/"+current.id,{
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      category: document.getElementById("mCat").value,
      title: document.getElementById("mName").value,
      text: document.getElementById("mText").value,
      review: document.getElementById("mReview").value,
      rating: rating
    })
  });
  closeModal(); loadStats(); load();
}

document.getElementById("q").oninput = e=>{
  clearTimeout(window._t);
  window._t = setTimeout(()=>{query = e.target.value.trim(); load();}, 300);
};

loadStats(); load(); loadProgress();
if(cat==="фильм"){ document.getElementById("filmsSection").style.display="block"; loadFilmsTable(); }
</script>
</body>
</html>
