<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" sizes="64x64" href="/static/favicon-64.png">
<link rel="icon" type="image/png" sizes="256x256" href="/static/favicon.png">
<link rel="apple-touch-icon" href="/static/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShotBox — мои скриншоты</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --card2:#1e222b; --line:#262b36;
    --text:#e8eaed; --muted:#9aa3b2; --accent:#4f8cff; --accent2:#7c5cff;
    --ok:#2ecc71; --warn:#f5a623;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.92);
         backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 20px}
  .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  h1{margin:0;font-size:19px;letter-spacing:.3px}
  h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2));
          -webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .stat{color:var(--muted);font-size:13px}
  input[type=search]{flex:1;min-width:180px;background:var(--card);border:1px solid var(--line);
    color:var(--text);border-radius:10px;padding:9px 14px;font-size:14px;outline:none}
  input[type=search]:focus{border-color:var(--accent)}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .tab{background:var(--card);border:1px solid var(--line);color:var(--muted);
       padding:7px 14px;border-radius:999px;cursor:pointer;font-size:13.5px;
       transition:.15s;user-select:none}
  .tab:hover{border-color:#3a4356;color:var(--text)}
  .tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
              border-color:transparent;color:#fff;font-weight:600}
  .tab .n{opacity:.75;font-size:12px;margin-left:4px}
  .progress-wrap{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:10px 14px;margin:12px 20px 0;display:flex;align-items:center;gap:12px;font-size:13px}
  .progress-wrap.hide{display:none}
  .progress-bar{flex:1;height:6px;background:#222733;border-radius:999px;overflow:hidden;min-width:80px}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));
    width:0;transition:width .6s ease;border-radius:999px}
  .pinfo{color:var(--muted);white-space:nowrap}
  .spinner{width:13px;height:13px;border:2px solid #2b3240;border-top-color:var(--accent);
    border-radius:50%;animation:spin 1s linear infinite;display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}
  .fmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11.5px;margin-top:2px}
  .imdb{color:#ffcc4d;font-weight:700}
  .st{padding:1px 7px;border-radius:999px;font-size:10.5px;border:1px solid}
  .st-released{color:#7ee0b8;border-color:#1c4a3a;background:#0d221c}
  .st-ongoing{color:#8fd0ff;border-color:#1c324a;background:#0d1a22}
  .st-upcoming{color:#ffd479;border-color:#4a3c1c;background:#221c0d}
  .st-unknown{color:var(--muted);border-color:var(--line);background:var(--card2)}
  main{padding:20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
  .card.kb-focus{outline:2px solid #4f8cff;outline-offset:2px}
  .card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;
        overflow:hidden;cursor:pointer;transition:.18s;display:flex;flex-direction:column}
  .card:hover{transform:translateY(-3px);border-color:#3a4356;
              box-shadow:0 10px 26px rgba(0,0,0,.45)}
  .thumb{width:100%;aspect-ratio:9/16;object-fit:cover;background:#0a0c10;display:block}
  .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:5px;flex:1}
  .title{font-weight:600;font-size:13.5px;line-height:1.35;
         display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .txt{color:var(--muted);font-size:12px;line-height:1.35;
       display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .meta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;
        color:#6b7484;font-size:11px;padding-top:6px}
  .badge{font-size:10.5px;padding:2px 8px;border-radius:999px;background:var(--card2);
         color:var(--muted);border:1px solid var(--line)}
  .badge.film{color:#ffd479;border-color:#4a3c1c;background:#221c0d}
  .badge.serial{color:#8fd0ff;border-color:#1c324a;background:#0d1a22}
  .badge.design{color:#c6a8ff;border-color:#35264a;background:#1a1226}
  .badge.olx{color:#7ee0b8;border-color:#1c4a3a;background:#0d221c}
  .badge.phrase{color:#ff9ec4;border-color:#4a1c30;background:#220d17}
  .badge.useful{color:#9ee37d;border-color:#2c4a1c;background:#152208}
  .badge.business{color:#ffc48f;border-color:#4a3520;background:#221a0d}
  .badge.books{color:#a9c8ff;border-color:#22354a;background:#0d1622}
  .badge.med{color:#ff9e9e;border-color:#4a2020;background:#220d0d}
  .badge.visa{color:#ffd0a8;border-color:#4a3a1c;background:#221a0d}
  .badge.travel{color:#8fe3ff;border-color:#1c3a4a;background:#0d1d22}
  .badge.work{color:#c8b8ff;border-color:#33264a;background:#161226}
  .badge.cartoon{color:#ffb3e6;border-color:#4a1c3a;background:#220d1a}
  .badge.docs{color:#d6d6d6;border-color:#3a3a3a;background:#1a1a1a}
  .badge.psy{color:#c9a8ff;border-color:#3a2a4a;background:#1c1226}
  .warn-b{font-size:12px;cursor:help}
  .badge.china{color:#ff9e9e;border-color:#4a2020;background:#220d0d}
  .badge.repair{color:#ffc48f;border-color:#4a3520;background:#221a0d}
  .badge.food{color:#a8e6a8;border-color:#204a20;background:#0d220d}
  .badge.fun{color:#ffe066;border-color:#4a4220;background:#221e0d}
  /* таблица фильмов */
  .films-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:12px}
  .films-head h2{margin:0;font-size:17px}
  .films-head label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer}
  .ftable{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);
          border-radius:12px;overflow:hidden;font-size:13px;margin-bottom:22px}
  .ftable th{position:sticky;top:0;background:var(--card2);text-align:left;padding:10px 12px;
             color:var(--muted);font-weight:600;font-size:12px;border-bottom:1px solid var(--line);
             cursor:pointer;white-space:nowrap;user-select:none}
  .ftable th:hover{color:var(--text)}
  .ftable td{padding:9px 12px;border-bottom:1px solid #1c2029;vertical-align:top}
  .ftable tr:last-child td{border-bottom:0}
  .ftable tr:hover td{background:#1a1e26}
  .ftable .fname{font-weight:600;cursor:pointer;min-width:150px}
  .ftable .fname:hover{color:var(--accent)}
  .ftable .fdesc{color:var(--muted);font-size:12px;max-width:340px;line-height:1.4}
  .ftable .fr{color:#ffcc4d;font-weight:700;white-space:nowrap}
  .ftable .fyear{color:var(--muted);white-space:nowrap}
  .ftable .fgenre{color:#9aa3b2;font-size:12px;max-width:130px}
  .ftable .fwatch{text-align:center}
  .ftable .ftorr{text-align:center;white-space:nowrap}
  .tlink{text-decoration:none;font-size:17px;opacity:.75;transition:.15s;display:inline-block;padding:2px 4px}
  .tlink:hover{opacity:1;transform:scale(1.2)}
  .ftable input[type=checkbox]{width:18px;height:18px;accent-color:#2ecc71;cursor:pointer}
  .ftable tr.watched td{opacity:.45}
  .subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
  .stab{background:var(--card);border:1px solid var(--line);color:var(--muted);
    padding:6px 14px;border-radius:999px;cursor:pointer;font-size:12.5px;transition:.15s}
  .stab:hover{color:var(--text);border-color:#3a4356}
  .stab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border-color:transparent;color:#fff;font-weight:600}
  .stab .n{opacity:.8;margin-left:5px;font-size:11px}
  .card .cact{position:absolute;top:6px;right:6px;z-index:3;display:flex;gap:4px;opacity:0;transition:.15s}
  .card:hover .cact{opacity:1}
  .cact button{background:rgba(10,12,16,.85);border:1px solid #3a4356;color:#e8eaed;border-radius:8px;
    width:28px;height:28px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  .cact button:hover{background:#2b3240}
  .cact .del:hover{background:#4a2020;border-color:#6a2a2a;color:#fff}
  .icon-btn{background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:10px;
    padding:8px 12px;cursor:pointer;font-size:15px;transition:.15s}
  .icon-btn:hover{color:var(--text);border-color:#3a4356}
  .set-row{display:flex;gap:10px;margin-top:6px}
  .fposter{position:relative}
  .pact{position:absolute;top:6px;right:6px;display:flex;gap:4px;opacity:0;transition:.15s;z-index:2}
  .fposter:hover .pact{opacity:1}
  .pact button{background:rgba(10,12,16,.85);border:1px solid #3a4356;color:#e8eaed;
    border-radius:8px;width:30px;height:30px;font-size:14px;cursor:pointer;display:flex;
    align-items:center;justify-content:center;padding:0}
  .pact button:hover{background:#2b3240}
  .pact .fav.on{color:#ffcc4d;border-color:#4a3c1c}
  .pact .del:hover{background:#4a2020;color:#fff;border-color:#6a2a2a}
  .fav-btn{background:transparent;border:1px solid var(--line);color:var(--muted);
    border-radius:8px;padding:3px 8px;cursor:pointer;font-size:15px;transition:.15s;line-height:1}
  .fav-btn.on{color:#ffcc4d;border-color:#4a3c1c;background:#221c0d}
  .del-btn{background:transparent;border:1px solid #4a2020;color:#ff7676;border-radius:8px;
    padding:3px 8px;cursor:pointer;font-size:12px;transition:.15s}
  .del-btn:hover{background:#4a2020;color:#fff}
  .view-toggle{display:flex;gap:4px;margin-left:auto}
  .vt-btn{background:var(--card);border:1px solid var(--line);color:var(--muted);
    padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12.5px}
  .vt-btn.active{background:var(--card2);color:var(--text);border-color:#3a4356}
  .fposters{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-bottom:22px}
  .fposter{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;
    cursor:pointer;transition:.18s;display:flex;flex-direction:column}
  .fposter:hover{transform:translateY(-3px);border-color:#3a4356}
  .fposter img{width:100%;aspect-ratio:2/3;object-fit:cover;background:#0a0c10;display:block}
  .fposter .pb{padding:8px 10px;display:flex;flex-direction:column;gap:4px}
  .fposter .pn{font-size:12.5px;font-weight:600;line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #posterPop{position:fixed;z-index:80;display:none;pointer-events:none;
    border-radius:10px;overflow:hidden;box-shadow:0 12px 34px rgba(0,0,0,.7);
    border:1px solid #333c4d;background:#000}
  #posterPop img{display:block;width:180px;height:auto}
  .fname{position:relative}
  .scans-title{font-size:15px;margin:0 0 12px}
  .empty{color:var(--muted);text-align:center;padding:60px 20px}
  /* modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;
         align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal.open{display:flex}
  .sheet{background:var(--card);border:1px solid var(--line);border-radius:16px;
         max-width:1000px;width:100%;max-height:92vh;overflow:auto;display:flex;flex-wrap:wrap}
  .sheet .imgwrap{flex:1 1 380px;background:#000;display:flex;align-items:center;justify-content:center}
  .sheet img{max-width:100%;max-height:88vh;object-fit:contain}
  .sheet .side{flex:1 1 320px;padding:20px;display:flex;flex-direction:column;gap:12px}
  .sheet h3{margin:0;font-size:17px}
  label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
  textarea,select,input[type=text]{width:100%;background:var(--card2);border:1px solid var(--line);
    color:var(--text);border-radius:9px;padding:9px 11px;font-size:13.5px;outline:none;font-family:inherit}
  textarea:focus,select:focus,input:focus{border-color:var(--accent)}
  .stars{display:flex;gap:4px;font-size:22px;cursor:pointer}
  .star{color:#3a4150}.star.on{color:#ffcc4d}
  .row{display:flex;gap:10px}
  .btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#fff;
       padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:600;font-size:13.5px}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
  .close{position:absolute;top:14px;right:18px;background:rgba(0,0,0,.6);border:0;color:#fff;
         font-size:22px;width:38px;height:38px;border-radius:50%;cursor:pointer}
  .link{color:var(--accent);font-size:12.5px;text-decoration:none}
  @media(max-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
    .thumb{aspect-ratio:9/14} main{padding:12px}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>📸 <span>ShotBox</span></h1>
    <div class="stat" id="stat">загрузка…</div>
    <input type="search" id="q" placeholder="Поиск: название фильма, фраза, приложение…">
    <button class="icon-btn" id="settingsBtn" title="Настройки">⚙</button>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<div class="progress-wrap" id="progressWrap">
  <span class="spinner" id="pSpin"></span>
  <span class="pinfo" id="pText">Анализ скриншотов…</span>
  <div class="progress-bar"><div class="progress-fill" id="pFill"></div></div>
  <span class="pinfo" id="pPct">0%</span>
  <span class="pinfo" id="pEta"></span>
</div>
<main>
  <section id="filmsSection" style="display:none">
    <div class="subtabs" id="filmSubTabs">
      <div class="stab active" data-sub="all">Все<span class="n" id="subAll">0</span></div>
      <div class="stab" data-sub="фильм">🎬 Фильмы<span class="n" id="subFilm">0</span></div>
      <div class="stab" data-sub="сериал">📺 Сериалы<span class="n" id="subSerial">0</span></div>
      <div class="stab" data-sub="мультфильм">🧸 Мультики<span class="n" id="subCartoon">0</span></div>
      <div class="stab" data-sub="favorite">⭐ Избранное<span class="n" id="subFav">0</span></div>
    </div>
    <div class="films-head">
      <h2 id="filmsCount">🎬 Фильмы и сериалы</h2>
      <label><input type="checkbox" id="hideWatched"> скрыть просмотренные</label>
      <div class="view-toggle">
        <button class="vt-btn active" data-view="table">▤ Таблица</button>
        <button class="vt-btn" data-view="posters">▦ Плитка</button>
      </div>
    </div>
    <table class="ftable">
      <thead><tr>
        <th data-sort="title">Название</th>
        <th data-sort="category">Тип</th>
        <th data-sort="imdb">★ IMDb</th>
        <th data-sort="kp_rating">КП</th>
        <th data-sort="year">Год</th>
        <th data-sort="genre">Жанр</th>
        <th>Описание</th>
        <th>★</th>
        <th data-sort="watched">Смотрел</th>
        <th></th>
      </tr></thead>
      <tbody id="filmsBody"></tbody>
    </table>
    <div class="fposters" id="filmsPosters" style="display:none"></div>
    <div class="empty" id="filmsEmpty" style="display:none">Пока нет распознанных фильмов</div>
    <h3 class="scans-title">Скрины</h3>
  </section>
  <div class="subtabs" id="tripSub" style="display:none;margin:0 0 14px">
  <div class="stab active" data-trip="all">✈️ Все<span class="n" id="tripAllN">0</span></div>
  <div class="stab" data-trip="китай">🇨🇳 Китай<span class="n" id="tripCnN">0</span></div>
</div>
<div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">Ничего не найдено</div>
</main>

<div class="modal" id="settingsModal">
  <div class="sheet" style="max-width:420px;position:relative">
    <button class="close" onclick="document.getElementById('settingsModal').classList.remove('open')">×</button>
    <div class="side" style="flex:1 1 100%">
      <h3>⚙ Настройки</h3>
      <div>
        <label>Текущий пароль</label>
        <input type="password" id="pwOld" autocomplete="current-password">
      </div>
      <div>
        <label>Новый пароль</label>
        <input type="password" id="pwNew" autocomplete="new-password">
      </div>
      <div>
        <label>Повторите новый пароль</label>
        <input type="password" id="pwNew2" autocomplete="new-password">
      </div>
      <div class="row" style="margin-top:14px">
        <button class="btn" onclick="changePassword()">Сменить пароль</button>
        <a class="btn ghost" href="/logout" style="text-decoration:none;text-align:center">Выйти</a>
      </div>
      <div class="stat" id="pwMsg" style="margin-top:8px"></div>
    </div>
  </div>
</div>

<div id="posterPop"><img id="posterPopImg" src="" alt=""></div>

<div class="modal" id="modal">
  <div class="sheet" style="position:relative">
    <button class="close" onclick="closeModal()">×</button>
    <div class="imgwrap"><img id="mImg" src=""></div>
    <div class="side">
      <h3 id="mTitle">—</h3>
      <div class="stat" id="mMeta"></div>
      <div id="mFilm" style="display:none"></div>
      <div>
        <label>Категория</label>
        <select id="mCat">
          <option value="фильм">🎬 Фильм</option>
          <option value="сериал">📺 Сериал</option>
          <option value="дизайн">🎨 Дизайн</option>
          <option value="олх">🛒 OLX</option>
          <option value="бизнес">💼 Бизнес</option>
          <option value="книги">📚 Книги</option>
          <option value="психология">🧠 Психология</option>
          <option value="медицина">🏥 Медицина</option>
          <option value="визы">🛂 Визы и переезд</option>
          <option value="путешествия">✈️ Путешествия</option>
          <option value="работа">💼 Работа</option>
          <option value="документы">📄 Документы</option>
          <option value="приколы">😂 Приколы</option>
          <option value="китай">🇨🇳 Китай</option>
          <option value="ремонт">🔨 Ремонт</option>
          <option value="питание">🍎 Питание</option>
          <option value="мультфильм">🧸 Мультфильм</option>
          <option value="фраза">💬 Фраза</option>
          <option value="полезность">🛠 Полезность</option>
          <option value="другое">📦 Прочее</option>
        </select>
      </div>
      <div>
        <label>Название / заголовок</label>
        <input type="text" id="mName" placeholder="Например: Дюна: Пророчество">
      </div>
      <div id="mPosterWrap" style="display:none">
        <img id="mPoster" src="" alt="" style="width:100%;max-width:230px;border-radius:12px;display:block">
      </div>
      <div>
        <label>Текст / описание</label>
        <textarea id="mText" rows="4"></textarea>
      </div>
      <div class="row" style="flex-wrap:wrap">
        <button class="btn" onclick="saveItem()">Сохранить</button>
        <button class="btn ghost" id="mFavBtn" onclick="favFromModal()" title="В избранное">☆ В избранное</button>
        <button class="btn ghost" onclick="refreshKp()" title="Перезапросить рейтинг/год/тип по названию">🔄 Кинопоиск</button>
        <button class="btn ghost" style="color:#ff7676;border-color:#4a2020" onclick="deleteItem(current.id)">🗑 Удалить</button>
      </div>
    </div>
  </div>
</div>

<script>
const CATS = [
  ["all","Всё"],["фильм","🎬 Фильмы"],["дизайн","🎨 Дизайн"],["олх","🛒 OLX"],
  ["бизнес","💼 Бизнес"],["книги","📚 Книги"],["психология","🧠 Психология"],["медицина","🏥 Медицина"],
  ["визы","🛂 Визы и переезд"],["путешествия","✈️ Путешествия"],["работа","💼 Работа"],
  ["документы","📄 Документы"],["приколы","😂 Приколы"],["ремонт","🔨 Ремонт"],["питание","🍎 Питание"],["фраза","💬 Фразы"],["полезность","🛠 Полезности"],
  ["другое","📦 Прочее"]
];
const BADGE = {фильм:"film", сериал:"serial", дизайн:"design", олх:"olx", фраза:"phrase", полезность:"useful", бизнес:"business", книги:"books", психология:"psy", медицина:"med", визы:"visa", путешествия:"travel", работа:"work", мультфильм:"cartoon", документы:"docs", приколы:"fun", китай:"china", ремонт:"repair", питание:"food"};
const ST_LABEL = {released:"Вышел", ongoing:"Идёт", upcoming:"Скоро", unknown:""};
let cat = "all", query = "", current = null, rating = 0, tripFilter = "all", lastList = [], kbIdx = -1;
// поддержка прямых ссылок: #фильм, #олх и т.д.
(function(){
  const h = decodeURIComponent(location.hash.slice(1));
  if(h && CATS.some(([k])=>k===h)) cat = h;
})();

function stBadge(st){
  if(!st || !ST_LABEL[st]) return "";
  return `<span class="st st-${st}">${ST_LABEL[st]}</span>`;
}
function filmMeta(it){
  if(!["фильм","сериал","мультфильм"].includes(it.category)) return "";
  const parts = [];
  if(it.imdb) parts.push(`<span class="imdb">★ ${it.imdb}</span>`);
  if(it.year) parts.push(`<span>${it.year}</span>`);
  const st = stBadge(it.status);
  if(st) parts.push(st);
  return parts.length ? `<div class="fmeta">${parts.join("")}</div>` : "";
}

async function loadProgress(){
  try{
    const p = await (await fetch("/api/progress")).json();
    const wrap = document.getElementById("progressWrap");
    if(p.percent >= 100){ wrap.classList.add("hide"); return; }
    wrap.classList.remove("hide");
    document.getElementById("pFill").style.width = p.percent + "%";
    document.getElementById("pPct").textContent = p.percent + "%";
    document.getElementById("pText").textContent =
      `Анализ: ${p.analyzed} из ${p.total}`;
    document.getElementById("pEta").textContent =
      p.eta_min > 0 ? `осталось ~${p.eta_min} мин` : "завершается…";
  }catch(e){}
}
setInterval(loadProgress, 15000);

let filmsData = [], filmsSort = {key:"imdb", dir:-1}, filmsView = "posters", filmSub = "all";

function typeBadge(it){
  const map = { "фильм":["🎬 Фильм","film"], "сериал":["📺 Сериал","serial"],
                "мультфильм":["🧸 Мультик","cartoon"] };
  const [label, cls] = map[it.category] || ["🎬 Фильм","film"];
  return `<span class="badge ${cls}" style="white-space:nowrap">${label}</span>`;
}

function cleanTitle(t){
  return (t||"").replace(/[«»"']/g,"").replace(/\s+/g," ").trim();
}
function stText(it){
  const st = {released:"Вышел", ongoing:"Идёт", upcoming:"Скоро"}[it.status] || "";
  return st;
}

async function loadFilmsTable(){
  const d = await (await fetch("/api/films?subtype=" + encodeURIComponent(filmSub))).json();
  filmsData = d.items || [];
  renderFilmsTable();
}

function renderFilmsTable(){
  const hideW = document.getElementById("hideWatched").checked;
  let items = filmsData.filter(i => !hideW || !i.watched);
  const {key, dir} = filmsSort;
  items = items.slice().sort((a,b)=>{
    let x = a[key], y = b[key];
    if(key==="title"||key==="genre"||key==="category"){ x=(x||"").toLowerCase(); y=(y||"").toLowerCase(); return x>y?dir:x<y?-dir:0; }
    x = (x===null||x===undefined) ? (dir>0?-1:99999) : Number(x);
    y = (y===null||y===undefined) ? (dir>0?-1:99999) : Number(y);
    return (x-y)*dir;
  });
  document.getElementById("filmsCount").textContent =
    `🎬 Фильмы и сериалы (${items.length})`;
  document.getElementById("filmsEmpty").style.display = items.length ? "none" : "block";
  // плиточный режим
  const pv = document.getElementById("filmsPosters");
  const tbl = document.querySelector(".ftable");
  if(filmsView === "posters"){
    pv.style.display = "grid";
    tbl.style.display = "none";
    pv.innerHTML = items.filter(i=>i.poster).map(it=>`
      <div class="fposter" onclick='openById(${it.id})'>
        <div class="pact">
          <button class="fav ${it.favorite?'on':''}" title="В избранное"
            onclick="event.stopPropagation();toggleFavorite(${it.id})">${it.favorite?"★":"☆"}</button>
          <button class="del" title="Удалить" onclick="event.stopPropagation();deleteFilm(${it.id})">🗑</button>
        </div>
        <img loading="lazy" src="/posters/${it.poster}" alt="">
        <div class="pb">
          <div class="pn">${esc(it.title||"Без названия")}</div>
          <div class="fmeta">${it.imdb?`<span class="imdb">★ ${it.imdb}</span>`:""}${it.year?`<span>${it.year}</span>`:""}</div>
        </div>
      </div>`).join("") || `<div class="empty">Нет постеров</div>`;
  } else {
    pv.style.display = "none";
    tbl.style.display = "";
  }

  document.getElementById("filmsBody").innerHTML = items.map(it=>{
    const st = stText(it);
    const desc = (it.text||"").replace(/\s+/g," ").trim();
    return `<tr class="${it.watched?'watched':''}">
      <td class="fname" data-pid="${it.poster||''}" onclick='openById(${it.id})'>${esc(it.title||"Без названия")}
        ${st?`<span class="st st-${it.status}">${st}</span>`:""}
        ${it.needs_review?'<span class="warn-b" title="Название не подтверждено текстом — проверь">⚠️</span>':""}</td>
      <td>${typeBadge(it)}</td>
      <td class="fr">${it.imdb?("★ "+it.imdb):"—"}</td>
      <td class="fr" style="color:#ff9e4a">${it.kp_rating?it.kp_rating:"—"}</td>
      <td class="fyear">${it.year||"—"}</td>
      <td class="fgenre">${esc(it.genre||"—")}</td>
      <td class="fdesc">${esc(desc.slice(0,160))}${desc.length>160?"…":""}</td>
      <td style="text-align:center"><button class="fav-btn ${it.favorite?'on':''}" title="В избранное"
          onclick="event.stopPropagation();toggleFavorite(${it.id})">${it.favorite?"★":"☆"}</button></td>
      <td class="fwatch"><input type="checkbox" ${it.watched?"checked":""}
          onchange="toggleWatched(${it.id}, this.checked)"></td>
      <td><button class="del-btn" title="Удалить фильм и скрин" onclick="event.stopPropagation();deleteFilm(${it.id})">🗑</button></td>
    </tr>`;
  }).join("");
}

// превью постера при наведении
(function(){
  const pop = document.getElementById("posterPop");
  const img = document.getElementById("posterPopImg");
  document.addEventListener("mouseover", e=>{
    const cell = e.target.closest(".fname");
    if(!cell) return;
    const id = cell.dataset.pid;
    if(!id) return;
    img.src = "/posters/" + id;
    pop.style.display = "block";
    const r = cell.getBoundingClientRect();
    let left = r.right + 14, top = r.top - 30;
    if(left + 190 > window.innerWidth) left = r.left - 194;
    if(top + 280 > window.innerHeight) top = window.innerHeight - 290;
    if(top < 8) top = 8;
    pop.style.left = left + "px";
    pop.style.top = top + "px";
  });
  document.addEventListener("mouseout", e=>{
    if(e.target.closest(".fname")) pop.style.display = "none";
  });
  window.addEventListener("scroll", ()=>{ pop.style.display = "none"; }, {passive:true});
})();

async function toggleFavorite(id){
  const rec = filmsData.find(x=>x.id===id);
  const val = rec && rec.favorite ? 0 : 1;
  await fetch(`/api/items/${id}`, {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({favorite: val})});
  if(rec) rec.favorite = val;
  renderFilmsTable(); loadStats();
}

function filterByApp(app){
  cat = "all";
  query = app || "";
  document.getElementById("q").value = query;
  history.replaceState(null,"","#all");
  loadStats(); load();
}

async function deleteItem(id){
  const card = document.querySelector(`.card[data-id="${id}"]`);
  if(card) card.style.opacity = ".35";
  if(!confirm("Удалить этот скриншот безвозвратно?\n\nФайл будет удалён и с сервера, и с NAS (Synology).")){
    if(card) card.style.opacity = "";
    return;
  }
  try{
    const r = await fetch(`/api/items/${id}?files=1&nas=1`, {method:"DELETE"});
    if(!r.ok) throw new Error("HTTP " + r.status);
    if(card) card.remove();
    if(current && current.id === id) closeModal();
    await loadStats();
    // если осталось мало — перечитываем список (без ожидания картинок)
    if(!document.querySelectorAll("#grid .card").length) await load();
  }catch(e){
    if(card) card.style.opacity = "";
    alert("Не удалось удалить: " + e.message);
  }
}

async function deleteItemOld(id){
  const rec = current && current.id === id ? current : null;
  if(!confirm("Удалить этот скриншот безвозвратно?\n\nФайл будет удалён и с сервера, и с NAS (Synology).")) return;
  const r = await fetch(`/api/items/${id}?files=1&nas=1`, {method:"DELETE"});
  if(r.ok){
    closeModal();
    loadStats(); load();
    if(document.getElementById("filmsSection").style.display === "block") loadFilmsTable();
  } else {
    alert("Не удалось удалить");
  }
}

function openSettings(){
  document.getElementById("settingsModal").classList.add("open");
  document.getElementById("pwMsg").textContent = "";
}

async function changePassword(){
  const oldP = document.getElementById("pwOld").value;
  const n1 = document.getElementById("pwNew").value;
  const n2 = document.getElementById("pwNew2").value;
  const msg = document.getElementById("pwMsg");
  if(!n1 || n1 !== n2){ msg.textContent = "Новые пароли не совпадают"; msg.style.color="#ff7676"; return; }
  const r = await fetch("/api/settings/password", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({old: oldP, new: n1})
  });
  const d = await r.json().catch(()=>({}));
  if(r.ok){
    msg.textContent = "✅ Пароль изменён. Войдите заново.";
    msg.style.color = "#7ee0b8";
    setTimeout(()=>location.href="/logout", 1500);
  } else {
    msg.textContent = "❌ " + (d.detail || "Ошибка");
    msg.style.color = "#ff7676";
  }
}

document.addEventListener("click", e=>{
  if(e.target.id === "settingsBtn") openSettings();
});

async function deleteFilm(id){
  const rec = filmsData.find(x=>x.id===id);
  const title = rec ? rec.title : "";
  if(!confirm(`Удалить «${title||"фильм"}» вместе со скрином?

Файл скриншота будет удалён безвозвратно.`)) return;
  const r = await fetch(`/api/items/${id}?files=1`, {method:"DELETE"});
  if(r.ok){
    filmsData = filmsData.filter(x=>x.id!==id);
    renderFilmsTable(); loadStats();
  } else {
    alert("Не удалось удалить");
  }
}

async function toggleWatched(id, val){
  await fetch("/api/items/"+id,{method:"POST",headers:{"Content-Type":"application/json"},
    body: JSON.stringify({watched: val?1:0})});
  const it = filmsData.find(x=>x.id===id);
  if(it) it.watched = val?1:0;
  renderFilmsTable();
}

async function openById(id){
  const it = filmsData.find(x=>x.id===id);
  if(!it) return;
  const full = await (await fetch("/api/items?q=&limit=500")).json();
  const found = full.items.find(x=>x.id===id) || it;
  openItem(found);
}

document.addEventListener("click", e=>{
  const th = e.target.closest(".ftable th[data-sort]");
  if(!th) return;
  const k = th.dataset.sort;
  filmsSort = {key:k, dir: (filmsSort.key===k ? -filmsSort.dir : -1)};
  renderFilmsTable();
});
document.addEventListener("change", e=>{
  if(e.target.id==="hideWatched") renderFilmsTable();
});
document.addEventListener("click", e=>{
  const sb = e.target.closest(".stab");
  if(sb){
    filmSub = sb.dataset.sub;
    document.querySelectorAll(".stab").forEach(x=>x.classList.toggle("active", x===sb));
    loadFilmsTable();
    return;
  }
  const b = e.target.closest(".vt-btn");
  if(!b) return;
  filmsView = b.dataset.view;
  document.querySelectorAll(".vt-btn").forEach(x=>x.classList.toggle("active", x===b));
  renderFilmsTable();
});

async function loadStats(){
  const s = await (await fetch("/api/stats")).json();
  document.getElementById("stat").textContent =
    `${s.total} скриншотов · распознано ${s.analyzed}`;
  // счётчики подтипов для фильмов
  const c = s.categories || {};
  const el = id => document.getElementById(id);
  if(el("subFilm")){
    el("subFilm").textContent = c["фильм"]||0;
    el("subSerial").textContent = c["сериал"]||0;
    el("subCartoon").textContent = c["мультфильм"]||0;
    el("subAll").textContent = (c["фильм"]||0)+(c["сериал"]||0)+(c["мультфильм"]||0);
    if(el("subFav")) el("subFav").textContent = s.favorites || 0;
  }

  const tabs = document.getElementById("tabs");
  tabs.innerHTML = CATS.map(([k,label])=>{
    const known = CATS.filter(([c])=>c!=="all"&&c!=="другое")
                      .reduce((a,[c])=>a+(s.categories[c]||0),0);
    const n = k==="all" ? s.total : (k==="другое" ? Math.max(s.total-known,0) : (s.categories[k]||0));
    return `<div class="tab ${k===cat?'active':''}" data-k="${k}">${label}<span class="n">${n}</span></div>`;
  }).join("");
  const ts = document.getElementById("tripSub");
  if(ts){
    ts.style.display = (cat === "путешествия") ? "flex" : "none";
    ts.querySelectorAll(".stab").forEach(b=>{
      b.classList.toggle("active", b.dataset.trip === tripFilter);
      b.onclick = ()=>{ tripFilter = b.dataset.trip; loadStats(); load(); };
    });
    if(el("tripAllN")) el("tripAllN").textContent = (c["путешествия"]||0) + (c["китай"]||0);
    if(el("tripCnN")) el("tripCnN").textContent = c["китай"]||0;
  }

  tabs.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
    cat=t.dataset.k; history.replaceState(null,"","#"+encodeURIComponent(cat)); loadStats(); load();
    const fs = document.getElementById("filmsSection");
    if(cat==="фильм"){ fs.style.display="block"; loadFilmsTable(); }
    else fs.style.display="none";
  });
}

async function load(){
  const catParam = (cat === "путешествия" && tripFilter === "китай") ? "китай" : cat;
  const r = await (await fetch(`/api/items?category=${encodeURIComponent(catParam)}&q=${encodeURIComponent(query)}`)).json();
  lastList = r.items || [];
  kbIdx = -1;
  const grid = document.getElementById("grid");
  document.getElementById("empty").style.display = r.items.length ? "none" : "block";
  grid.innerHTML = r.items.map(it=>{
    const b = BADGE[it.category] || "";
    const title = it.title || it.app || "Без названия";
    const txt = it.text || it.review || "";
    const d = (it.shot_date||"").slice(0,10);
    return `<div class="card" data-id="${it.id}" onclick='openItem(${JSON.stringify(it).replace(/'/g,"&#39;")})'>
      <div class="cact">
        <button class="del" title="Удалить скриншот" onclick="event.stopPropagation();deleteItem(${it.id})">🗑</button>
      </div>
      <img class="thumb" loading="lazy" src="/thumbs/${it.thumb}" alt="">
      <div class="body">
        <div class="title">${esc(title)}</div>
        ${txt?`<div class="txt">${esc(txt)}</div>`:""}
        ${filmMeta(it)}
        <div class="meta"><span>${esc(it.app||"")}${it.dup_count>1?` <span class="badge">×${it.dup_count}</span>`:""}</span><span>${d}</span></div>
        ${b?`<span class="badge ${b}">${esc(it.category)}</span>`:""}
      </div></div>`;
  }).join("");
}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function openItem(it){
  current = it; rating = it.rating||0;
  document.getElementById("mImg").src = "/photos/" + it.rel_path;
  document.getElementById("mTitle").textContent = it.title || it.app || "—";
  document.getElementById("mMeta").textContent =
    `${it.app||""} · ${it.shot_date||""}`;
  document.getElementById("mCat").value = it.category==="не разобрано" ? "другое" : it.category;
  document.getElementById("mName").value = it.title||"";
  document.getElementById("mText").value = it.text||"";

  const mp = document.getElementById("mPoster");
  const mpw = document.getElementById("mPosterWrap");
  if(it.poster){ mp.src = "/posters/" + it.poster; mpw.style.display = "block"; }
  else { mp.src = ""; mpw.style.display = "none"; }

  const mf = document.getElementById("mFilm");
  if(["фильм","сериал","мультфильм"].includes(it.category)){
    const bits = [];
    if(it.imdb) bits.push(`<span class="imdb">★ ${it.imdb} IMDb</span>`);
    if(it.kp_rating) bits.push(`<span style="color:#ff9e4a;font-weight:700">КП ${it.kp_rating}</span>`);
    if(it.year) bits.push(`<span>${it.year}</span>`);
    if(it.genre) bits.push(`<span style="color:var(--muted)">${esc(it.genre)}</span>`);
    const st = stBadge(it.status);
    if(st) bits.push(st);
    const q = encodeURIComponent(it.title || it.text || "");
    const tq = encodeURIComponent(cleanTitle(it.title));
    if(it.kp_id) bits.push(`<a class="link" target="_blank" href="https://www.kinopoisk.ru/film/${it.kp_id}/">🎬 Кинопоиск ↗</a>`);
    else bits.push(`<a class="link" target="_blank" href="https://www.kinopoisk.ru/index.php?kp_query=${q}">Кинопоиск ↗</a>`);
    mf.innerHTML = `<div class="fmeta">${bits.join("")}</div>`;
    mf.style.display = "block";
  } else {
    mf.style.display = "none";
  }

  paintFavBtn();
  document.getElementById("modal").classList.add("open");
}
function closeModal(){document.getElementById("modal").classList.remove("open");}
document.getElementById("modal").onclick = e=>{ if(e.target.id==="modal") closeModal(); };

// ── листание стрелками ──
function openByIndex(i){
  if(!lastList.length) return;
  kbIdx = Math.max(0, Math.min(lastList.length - 1, i));
  const cards = document.querySelectorAll("#grid .card");
  cards.forEach(c=>c.classList.remove("kb-focus"));
  if(cards[kbIdx]){
    cards[kbIdx].classList.add("kb-focus");
    cards[kbIdx].scrollIntoView({block:"nearest", behavior:"smooth"});
  }
}

document.addEventListener("keydown", e=>{
  const tag = (e.target.tagName || "").toLowerCase();
  if(tag === "input" || tag === "textarea" || tag === "select") return;
  const modalOpen = document.getElementById("modal").classList.contains("open");

  if(e.key === "ArrowRight" || e.key === "ArrowLeft"){
    const step = (e.key === "ArrowRight") ? 1 : -1;
    if(modalOpen){
      if(!current) return;
      const i = lastList.findIndex(x=>x.id === current.id);
      if(i < 0) return;
      const next = i + step;
      if(next >= 0 && next < lastList.length){ e.preventDefault(); openItem(lastList[next]); }
    } else {
      e.preventDefault();
      openByIndex(kbIdx < 0 ? (step > 0 ? 0 : lastList.length - 1) : kbIdx + step);
    }
  }
  if(e.key === "Enter" && !modalOpen && kbIdx >= 0 && lastList[kbIdx]){
    openItem(lastList[kbIdx]);
  }
  if(e.key === "Escape" && modalOpen) closeModal();
});

async function favFromModal(){
  if(!current) return;
  const val = current.favorite ? 0 : 1;
  await fetch(`/api/items/${current.id}`, {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({favorite: val})});
  current.favorite = val;
  paintFavBtn();
  loadFilmsTable();
}

function paintFavBtn(){
  const b = document.getElementById("mFavBtn");
  if(!b || !current) return;
  b.textContent = current.favorite ? "★ В избранном" : "☆ В избранное";
  b.style.color = current.favorite ? "#ffcc4d" : "";
}

async function refreshKp(){
  if(!current) return;
  const title = document.getElementById("mName").value.trim() || current.title || "";
  if(!title) return alert("Сначала укажите название");
  const btn = event.target;
  btn.disabled = true; btn.textContent = "⏳ ищу…";
  try{
    const r = await fetch(`/api/items/${current.id}/refresh-kp`, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({title})
    });
    const d = await r.json();
    if(d.ok){
      alert(`✅ Найдено: ${d.title}
Тип: ${d.type} | ${d.year} | IMDb ${d.imdb||"—"} | КП ${d.kp||"—"}
Совпадение: ${Math.round(d.score*100)}%`);
      closeModal(); loadStats(); loadFilmsTable(); load();
    } else {
      alert("Не найдено: " + (d.reason||"нет совпадений"));
    }
  }catch(e){
    alert("Ошибка запроса");
  }finally{
    btn.disabled = false; btn.textContent = "🔄 Кинопоиск";
  }
}

async function saveItem(){
  if(!current) return;
  await fetch("/api/items/"+current.id,{
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      category: document.getElementById("mCat").value,
      title: document.getElementById("mName").value,
      text: document.getElementById("mText").value,
      rating: rating
    })
  });
  closeModal(); loadStats(); load();
}

document.getElementById("q").oninput = e=>{
  clearTimeout(window._t);
  window._t = setTimeout(()=>{query = e.target.value.trim(); load();}, 300);
};

loadStats(); load(); loadProgress();
if(cat==="фильм"){ document.getElementById("filmsSection").style.display="block"; loadFilmsTable(); }
